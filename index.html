
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="weather-container">

        <h1>☀️ Weather Forecast</h1>
        <p class="subtitle">Check today's weather in your city</p>

        <form id="weatherForm">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name (e.g. London)"
                required
            >
            <button type="submit">Get Weather</button>
        </form>

        <p id="message"></p>

        <div class="weather-card" id="weatherCard">

            <h2 id="cityName">City Name</h2>
            <p id="date"></p>

            <img id="weatherIcon" src="" alt="Weather Icon">

            <h1 id="temperature">--°C</h1>
            <h3 id="condition">Weather Condition</h3>

            <div class="weather-details">

                <div class="detail">
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <h3 id="feelsLike">--°C</h3>
                </div>

                <div class="detail">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h3 id="humidity">--%</h3>
                </div>

                <div class="detail">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h3 id="wind">-- km/h</h3>
                </div>

                <div class="detail">
                    <span>🌤️</span>
                    <p>Max Temperature</p>
                    <h3 id="maxTemp">--°C</h3>
                </div>

                <div class="detail">
                    <span>❄️</span>
                    <p>Min Temperature</p>
                    <h3 id="minTemp">--°C</h3>
                </div>

                <div class="detail">
                    <span>🌧️</span>
                    <p>Chance of Rain</p>
                    <h3 id="rain">--%</h3>
                </div>

            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
